<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>chaos.io — игрок standoff 2</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background: #000000; color: #ffffff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  .wrap {
    position: relative; z-index: 2;
    padding: 24px 28px;
    max-width: 900px;
  }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: 36px; line-height: 1.15; letter-spacing: -0.03em;
    color: #f5f5f7;
    text-shadow: 0 2px 24px #000, 0 0 6px #000;
  }
  @media (min-width: 600px) { h1 { font-size: 64px; } }

  .word {
    display: inline-block; margin: 0 .14em;
    animation: rise 1s cubic-bezier(.22,1,.36,1) both;
  }
  .word:nth-child(1) { animation-delay: .3s; }
  .word:nth-child(2) { animation-delay: .5s; color: #86868b; }
  .word:nth-child(3) { animation-delay: .7s; }
  .word:nth-child(4) { animation-delay: .9s; }

  /* Цветки — большие, частично уходят за край экрана */
  .fl {
    position: absolute; z-index: 1;
    pointer-events: none;
    animation: bloom 1.8s cubic-bezier(.22,1,.36,1) both;
  }
  .fl .layer {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    animation: spin 40s linear infinite;
  }
  .fl .layer svg { display: block; width: 100%; height: 100%; }
  .fl .mid   { animation-duration: 28s; animation-direction: reverse; }
  .fl .inner { animation-duration: 18s; }

  .fl.a { width: clamp(170px, 46vw, 400px); height: clamp(170px, 46vw, 400px); left: -14vw; top: -10vh; animation-delay: .4s; }
  .fl.b { width: clamp(110px, 30vw, 260px); height: clamp(110px, 30vw, 260px); right: -9vw; top: 8vh;   animation-delay: .7s; }
  .fl.c { width: clamp(120px, 32vw, 280px); height: clamp(120px, 32vw, 280px); left: -8vw;  bottom: 4vh;  animation-delay: 1s; }
  .fl.d { width: clamp(190px, 52vw, 440px); height: clamp(190px, 52vw, 440px); right: -16vw; bottom: -12vh; animation-delay: 1.2s; }
  .fl.b .outer, .fl.d .outer { animation-direction: reverse; }
  .fl.b .mid,   .fl.d .mid   { animation-direction: normal; }
  .fl.c .outer { animation-duration: 55s; }
  .fl.c .mid   { animation-duration: 36s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bloom {
    from { opacity: 0; transform: scale(.15) rotate(-70deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .word, .fl, .fl .layer { animation: none; }
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.55" stop-color="#e9e9ee"/>
        <stop offset="1" stop-color="#7d7d86"/>
      </linearGradient>
      <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#b4b4bc"/>
      </linearGradient>

      <!-- Лепесток: капля с прожилкой -->
      <g id="petal">
        <path d="M50 50 C 36 40, 33 17, 50 2 C 67 17, 64 40, 50 50 Z" fill="url(#pg)" stroke="#000" stroke-opacity=".55" stroke-width=".7"/>
        <path d="M50 46 C 49.3 34, 49.3 20, 50 9" fill="none" stroke="#000" stroke-opacity=".16" stroke-width=".9" stroke-linecap="round"/>
      </g>

      <g id="outerPetals">
        <use href="#petal" transform="rotate(0 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(30 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(60 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(90 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(120 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(150 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(180 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(210 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(240 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(270 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(300 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(330 50 50) translate(50 50) scale(1) translate(-50 -50)"/>
      </g>
      <g id="midPetals">
        <use href="#petal" transform="rotate(22.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(67.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(112.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(157.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(202.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(247.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(292.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(337.5 50 50) translate(50 50) scale(0.74) translate(-50 -50)"/>
      </g>
      <g id="innerPetals">
        <use href="#petal" transform="rotate(10 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(70 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(130 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(190 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(250 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <use href="#petal" transform="rotate(310 50 50) translate(50 50) scale(0.46) translate(-50 -50)"/>
        <circle cx="50" cy="50" r="7.2" fill="#0a0a0a" stroke="#fff" stroke-width="1.6"/>
        <circle cx="61.00" cy="50.00" r="1.5" fill="#fff"/>
        <circle cx="59.53" cy="55.50" r="1.5" fill="#fff"/>
        <circle cx="55.50" cy="59.53" r="1.5" fill="#fff"/>
        <circle cx="50.00" cy="61.00" r="1.5" fill="#fff"/>
        <circle cx="44.50" cy="59.53" r="1.5" fill="#fff"/>
        <circle cx="40.47" cy="55.50" r="1.5" fill="#fff"/>
        <circle cx="39.00" cy="50.00" r="1.5" fill="#fff"/>
        <circle cx="40.47" cy="44.50" r="1.5" fill="#fff"/>
        <circle cx="44.50" cy="40.47" r="1.5" fill="#fff"/>
        <circle cx="50.00" cy="39.00" r="1.5" fill="#fff"/>
        <circle cx="55.50" cy="40.47" r="1.5" fill="#fff"/>
        <circle cx="59.53" cy="44.50" r="1.5" fill="#fff"/>
        <circle cx="50" cy="50" r="2.4" fill="#fff"/>
      </g>
    </defs>
  </svg>

  <div class="fl a">
    <div class="layer outer"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#outerPetals"/></svg></div>
    <div class="layer mid"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#midPetals"/></svg></div>
    <div class="layer inner"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#innerPetals"/></svg></div>
  </div>
  <div class="fl b">
    <div class="layer outer"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#outerPetals"/></svg></div>
    <div class="layer mid"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#midPetals"/></svg></div>
    <div class="layer inner"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#innerPetals"/></svg></div>
  </div>
  <div class="fl c">
    <div class="layer outer"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#outerPetals"/></svg></div>
    <div class="layer mid"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#midPetals"/></svg></div>
    <div class="layer inner"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#innerPetals"/></svg></div>
  </div>
  <div class="fl d">
    <div class="layer outer"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#outerPetals"/></svg></div>
    <div class="layer mid"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#midPetals"/></svg></div>
    <div class="layer inner"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#innerPetals"/></svg></div>
  </div>

  <div class="wrap">
    <h1>
      <span class="word">chaos.io</span>
      <span class="word">—</span>
      <span class="word">игрок</span>
      <span class="word">standoff&nbsp;2</span>
    </h1>
  </div>

</body>
</html>
